name: Native Windows Build

on:
  push:
    branches:
      - native-port
  pull_request:
    branches:
      - master
      - native-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ./TheLostDays.Native/TheLostDays.Native.csproj

      - name: Build
        run: dotnet build ./TheLostDays.Native/TheLostDays.Native.csproj --configuration Release --no-restore

      - name: Publish self-contained single-file EXE
        run: dotnet publish ./TheLostDays.Native/TheLostDays.Native.csproj --configuration Release --runtime win-x64 --self-contained true --output ./artifacts/TheLostDays-win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "./artifacts/TheLostDays-win-x64/TheLostDays.exe")) {
            throw "Native executable was not produced."
          }

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: TheLostDays-Native-Windows-x64
          path: artifacts/TheLostDays-win-x64/
          if-no-files-found: error
          retention-days: 30
